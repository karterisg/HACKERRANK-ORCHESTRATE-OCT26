name: Deletion Audit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile code/main.py code/validate.py && echo "Syntax OK"

  test:
    name: Sample case validation
    runs-on: ubuntu-latest
    # Only runs when dataset files are available (added as repo secret or uploaded manually)
    # To enable: add your dataset/ folder contents as a GitHub Actions cache or artifact
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check if dataset is available
        id: dataset_check
        run: |
          if [ -f "dataset/sample_deletion_requests.csv" ] && [ -f "dataset/sample_output.csv" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "Dataset not present in repo (excluded by .gitignore). Skipping validation."
          fi

      - name: Run agent on sample cases
        if: steps.dataset_check.outputs.available == 'true'
        run: python code/main.py --sample

      - name: Validate output against sample answers
        if: steps.dataset_check.outputs.available == 'true'
        run: |
          python code/validate.py | tee results.txt
          python - <<'EOF'
          import re, sys
          txt = open("results.txt").read()
          m = re.search(r"STATUS ACCURACY:\s+(\d+)/(\d+)", txt)
          if not m:
              print("Could not parse accuracy")
              sys.exit(1)
          correct, total = int(m.group(1)), int(m.group(2))
          pct = correct / total * 100
          print(f"Status accuracy: {correct}/{total} = {pct:.1f}%")
          if pct < 90:
              print(f"FAIL: {pct:.1f}% is below the 90% threshold")
              sys.exit(1)
          print("PASS")
          EOF

      - name: Upload results
        if: steps.dataset_check.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: |
            output.csv
            results.txt
