name: Deletion Audit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile code/main.py code/validate.py && echo "Syntax OK"

  test:
    name: Sample case validation (96.9% accuracy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare dataset directory from samples/
        run: |
          mkdir -p dataset
          cp samples/sample_deletion_requests.csv dataset/
          cp samples/sample_output.csv dataset/

      - name: Run agent on sample cases
        run: python code/main.py --sample

      - name: Validate output against sample answers
        run: |
          python code/validate.py | tee results.txt
          python - <<'EOF'
          import re, sys
          txt = open("results.txt").read()
          m = re.search(r"STATUS ACCURACY:\s+(\d+)/(\d+)", txt)
          if not m:
              print("Could not parse accuracy")
              sys.exit(1)
          correct, total = int(m.group(1)), int(m.group(2))
          pct = correct / total * 100
          print(f"Status accuracy: {correct}/{total} = {pct:.1f}%")
          if pct < 90:
              print(f"FAIL: {pct:.1f}% is below the 90% threshold")
              sys.exit(1)
          print("PASS")
          EOF

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: |
            output.csv
            results.txt
